<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập · LimoGo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/mobile-app.css" />
  </head>
  <body>
    <div class="app-shell auth-shell">
      <div class="mobile-frame">
        <header class="top-appbar">
          <div class="brand-mini">
            <span class="logo">L</span>
            <span>LimoGo</span>
          </div>
          <div class="top-actions">
            <button class="icon-pill" type="button">⚙</button>
          </div>
        </header>

        <div class="auth-hero">
          <div class="brand-mini">
            <span class="logo">L</span>
            <span>Đăng nhập</span>
          </div>
          <a href="../index.html" class="soft-button">Trang chủ</a>
        </div>

        <div class="auth-tab-row">
          <button type="button" class="auth-tab active" data-mode="login">Đăng nhập</button>
          <button type="button" class="auth-tab" data-mode="register">Đăng ký</button>
        </div>

        <div class="screen-header" style="padding-top: 0;">
          <span class="screen-kicker">LIMOGO</span>
          <h2 id="formTitle">Chào mừng trở lại</h2>
          <p id="formSubtitle">Đăng nhập để theo dõi chuyến xe và quản lý ví của bạn.</p>
        </div>

        <section class="form-card">
          <form class="auth-form" id="authForm">
            <div class="input-group register-only" style="display: none;">
              <label>Họ và tên</label>
              <input type="text" placeholder="Nguyễn Văn A" />
            </div>
            <div class="input-group">
              <label>Email</label>
              <input type="email" placeholder="you@example.com" />
            </div>
            <div class="input-group">
              <label>Mật khẩu</label>
              <input type="password" placeholder="••••••••" />
            </div>
            <div class="input-group register-only" style="display: none;">
              <label>Nhập lại mật khẩu</label>
              <input type="password" placeholder="Nhập lại mật khẩu" />
            </div>
            <button class="primary-button" id="authSubmit" type="submit">Đăng nhập</button>
          </form>
          <p class="inline-text" id="authStatus">Bạn chưa đăng nhập</p>
          <p class="inline-text">Hoặc tiếp tục với <button class="link-button" type="button">Google</button></p>
        </section>
      </div>
    </div>

    <nav class="footer-nav" aria-label="Điều hướng ứng dụng">
      <a href="../index.html" class="nav-item"><span class="nav-icon">⌂</span><span>Trang chủ</span></a>
      <a href="booking.html" class="nav-item"><span class="nav-icon">⌁</span><span>Đặt xe</span></a>
      <a href="account.html" class="nav-item"><span class="nav-icon">♙</span><span>Tài khoản</span></a>
      <a href="auth.html" class="nav-item active"><span class="nav-icon">◌</span><span>Đăng nhập</span></a>
    </nav>

    <script src="../js/auth-flow.js"></script>
  </body>
</html>
